name: Build PastaCode Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          brew install dpkg ldid

      - name: Setup Theos & SDKs
        run: |
          echo "Setting up Theos..."
          git clone --recursive https://github.com/theos/theos.git $GITHUB_WORKSPACE/theos
          rm -rf $GITHUB_WORKSPACE/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $GITHUB_WORKSPACE/theos/sdks
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Build PastaCode Dylib
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          chmod +x build.sh
          ./build.sh

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PastaCode-dylib
          path: |
            packages/PastaCode.dylib
            PastaCode.plist
          if-no-files-found: error
